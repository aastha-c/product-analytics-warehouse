version: 2

models:
  - name: dim_user
    description: "SCD Type-2 user dimension table"
    columns:
      - name: user_sk
        tests:
          - unique
          - not_null
      - name: user_id
        tests:
          - not_null
      - name: is_current
        tests:
          - not_null

  - name: fact_events
    description: "Partitioned granular events fact table"
    columns:
      - name: event_id
        tests:
          - unique
          - not_null
      - name: user_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_user')
              field: user_sk
      - name: event_date
        tests:
          - not_null
      - name: platform
        tests:
          - accepted_values:
              values: ['ios', 'android', 'web']

  - name: fact_orders
    description: "Partitioned monetary order fact table"
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: order_amount
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0.0"
